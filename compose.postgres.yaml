# Optional production PostgreSQL content mode. Use together with compose.yaml.
x-pg-env: &pg-env
  BOOK_PG_DSN: "pgsql:host=postgres;port=5432;dbname=book;connect_timeout=5"
  BOOK_PG_USER: book
  BOOK_PG_PASSWORD: ${BOOK_PG_PASSWORD:?Set BOOK_PG_PASSWORD in the environment or a private .env file}
  BOOK_PG_NAMESPACE: ${BOOK_PG_NAMESPACE:?Generate a unique 32-character hex namespace}
services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: book
      POSTGRES_USER: book_admin
      POSTGRES_PASSWORD: ${BOOK_PG_ADMIN_PASSWORD:?Set a separate PostgreSQL admin password}
      BOOK_PG_PASSWORD: ${BOOK_PG_PASSWORD:?Set BOOK_PG_PASSWORD}
    volumes:
      - book-postgres:/var/lib/postgresql/data
      - ./bin/postgres-init.sh:/docker-entrypoint-initdb.d/10-book.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U book -d book']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  book:
    environment: *pg-env
    depends_on:
      postgres:
        condition: service_healthy
  worker:
    environment: *pg-env
    depends_on:
      postgres:
        condition: service_healthy
      book:
        condition: service_healthy
volumes:
  book-postgres:
