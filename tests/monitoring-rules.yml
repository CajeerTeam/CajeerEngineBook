rule_files: [/rules/alerts.yml]
evaluation_interval: 30s
tests:
  - interval: 30s
    input_series:
      - series: 'book_dependency_up{component="redis",job="book",instance="diagnostics:80"}'
        values: '0x10'
      - series: 'book_dependency_up{component="worker",job="book",instance="diagnostics:80"}'
        values: '0x10'
      - series: 'book_dependency_up{component="backup",job="book",instance="diagnostics:80"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 1m
        alertname: BookDependencyUnavailable
        exp_alerts: []
      - eval_time: 3m
        alertname: BookDependencyUnavailable
        exp_alerts:
          - exp_labels: {component: redis, job: book, instance: 'diagnostics:80', severity: critical}
            exp_annotations: {summary: 'Book dependency unavailable: redis'}
      - eval_time: 3m
        alertname: BookWorkerStale
        exp_alerts:
          - exp_labels: {component: worker, job: book, instance: 'diagnostics:80', severity: critical}
            exp_annotations: {summary: 'No successful worker tick in five minutes'}
      - eval_time: 3m
        alertname: BookBackupStale
        exp_alerts:
          - exp_labels: {component: backup, job: book, instance: 'diagnostics:80', severity: critical}
            exp_annotations: {summary: 'Backup RPO exceeded'}
  - interval: 30s
    input_series:
      - series: 'book_dependency_up{component="redis",job="book",instance="diagnostics:80"}'
        values: '0x5 1x5'
    alert_rule_test:
      - eval_time: 2m30s
        alertname: BookDependencyUnavailable
        exp_alerts:
          - exp_labels: {component: redis, job: book, instance: 'diagnostics:80', severity: critical}
            exp_annotations: {summary: 'Book dependency unavailable: redis'}
      - eval_time: 4m
        alertname: BookDependencyUnavailable
        exp_alerts: []
  - interval: 30s
    input_series:
      - series: 'book_http_requests_total{route="reader",method="GET",status="2xx"}'
        values: '0+100x30'
      - series: 'book_http_requests_total{route="reader",method="GET",status="429"}'
        values: '0+1x30'
      - series: 'book_http_requests_total{route="reader",method="GET",status="4xx"}'
        values: '0+1000x30'
      - series: 'book_http_request_duration_seconds_bucket{route="reader",le="1"}'
        values: '0+90x30'
      - series: 'book_http_request_duration_seconds_bucket{route="reader",le="2"}'
        values: '0+101x30'
      - series: 'book_http_request_duration_seconds_bucket{route="reader",le="+Inf"}'
        values: '0+101x30'
    alert_rule_test:
      - eval_time: 12m
        alertname: BookPublicReadAvailabilitySLO
        exp_alerts:
          - exp_labels: {route: reader, severity: warning}
            exp_annotations: {summary: 'Public read error budget exceeded: reader'}
      - eval_time: 12m
        alertname: BookPublicReadTailLatency
        exp_alerts:
          - exp_labels: {route: reader, severity: warning}
            exp_annotations: {summary: 'Public read p99 exceeds 1 second: reader'}
