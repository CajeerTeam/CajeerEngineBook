# Test-only local CA and controlled DNS resolver; never use in production.
services:
  book:
    dns:
      - 172.30.44.12
  proxy:
    volumes: !override
      - ${BOOK_TEST_CADDYFILE:?Set test Caddyfile}:/etc/caddy/Caddyfile:ro
      - book-tls:/data
      - book-tls-config:/config
  dns-fixture:
    image: python:3.12-alpine
    command: [python, /fixture/dns.py]
    networks:
      book-edge:
        ipv4_address: 172.30.44.12
    volumes:
      - ./tests/domains-dns.py:/fixture/dns.py:ro
      - ${BOOK_TEST_DNS_DIR:?Set DNS records directory}:/records:ro
    healthcheck:
      test: [CMD, python, -c, 'import socket; s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM); s.settimeout(2); s.sendto(bytes.fromhex("12340100000100000000000001610000100001"),("127.0.0.1",53)); assert s.recv(512)[:2]==bytes.fromhex("1234")']
      interval: 2s
      timeout: 3s
      retries: 20

  backup:
    environment:
      BOOK_BACKUP_S3_URI: ''
      BOOK_BACKUP_REMOTE_DIR: /test-remote
    volumes:
      - ${BOOK_TEST_DNS_DIR:?Set DNS records directory}/remote:/test-remote

  prometheus:
    ports: !reset []
  grafana:
    ports: !reset []
  monitoring-receiver:
    image: python:3.12-alpine
    command: [python, /fixture/monitoring-receiver.py]
    networks: [monitoring]
    volumes:
      - ./tests/monitoring-receiver.py:/fixture/monitoring-receiver.py:ro
      - ./tests/monitoring-check.py:/fixture/monitoring-check.py:ro
      - ${BOOK_TEST_DNS_DIR:?Set DNS records directory}:/fixture-data:ro
      - ${BOOK_TEST_DNS_DIR:?Set DNS records directory}/alerts:/alerts
