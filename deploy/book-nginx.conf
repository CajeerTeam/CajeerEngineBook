# Internal HTTP edge. Terminate public TLS at a trusted external ingress.
log_format book_path '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
# Docker Compose can withdraw a stopped replica from service DNS before its IP
# becomes unreachable from every existing TCP path. Keep the cache short so the
# edge can discover the surviving replica promptly during an abrupt stop.
resolver 127.0.0.11 valid=1s ipv6=off;
upstream book_nodes {
    zone book_nodes 64k;
    # Nginx 1.28+ maintains all A records from Docker's scaled service name.
    # A failed connection must not pin a dead replica for the old 5s window.
    server book:80 resolve max_fails=1 fail_timeout=2s;
}
# Only explicitly read-only routes may replay after a failed upstream connection.
# Auth callbacks, Studio, CI and all mutations are excluded, even when using GET.
map "$request_method:$uri" $book_safe_read {
    default 0;
    "~^(GET|HEAD):/(?:w/[a-f0-9]{32}/[a-f0-9]{32}/)?(?:docs/|media/|api/v1/pages(?:/|$)|api/v1/search$|search$|l/(?:en|ru)/docs/)" 1;
    ~^(GET|HEAD):/(?:assets/|health/(?:live|ready)$|sitemap\.xml$|robots\.txt$) 1;
    ~^(GET|HEAD):/$ 1;
}
server {
    listen 80;
    access_log /var/log/nginx/access.log book_path;
    server_name _;
    client_max_body_size 72m;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Book-Client-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Book-Edge-Secret "";
    proxy_set_header X-Book-Edge-Proto "";
    proxy_set_header Connection "";
    # A stopped container can blackhole SYN packets. A short connect timeout lets
    # safe reads retry another replica before the client's own deadline.
    proxy_connect_timeout 1s;
    proxy_read_timeout 130s;
    proxy_send_timeout 130s;
    location / {
        error_page 418 = @book_read;
        if ($book_safe_read) { return 418; }
        proxy_pass http://book_nodes;
        proxy_next_upstream off;
    }
    location @book_read {
        proxy_pass http://book_nodes;
        proxy_next_upstream error timeout http_502 http_504;
        proxy_next_upstream_tries 4;
        proxy_next_upstream_timeout 9s;
    }
}
