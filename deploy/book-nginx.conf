# Internal HTTP edge. Terminate public TLS at a trusted external ingress.
log_format book_path '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
resolver 127.0.0.11 valid=5s ipv6=off;
upstream book_nodes {
    zone book_nodes 64k;
    server book:80 resolve;
}
server {
    listen 80;
    access_log /var/log/nginx/access.log book_path;
    server_name _;
    client_max_body_size 72m;
    location / {
        proxy_pass http://book_nodes;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Book-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header Connection "";
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
        # Never replay a mutation when a backend fails after accepting it.
        proxy_next_upstream off;
    }
}
