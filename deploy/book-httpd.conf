# Apache/PHP application runtime. Explicit modules; no default vhost, CGI or aliases.
ServerRoot "/var/www"
ServerName localhost
Listen 80
PidFile /run/apache2/httpd.pid
LoadModule mpm_prefork_module /usr/lib/apache2/mod_mpm_prefork.so
# mod_php uses one Apache process per active request. A request can hold
# independent PostgreSQL identity and content sessions. Without an explicit
# prefork bound, two app replicas can exhaust PostgreSQL's default 100 slots
# during a 100-client burst, returning 503 despite healthy SQL/Redis services.
# Size this per replica together with database max_connections and the number
# of replicas. The small default leaves room for workers, migrations and probes.
<IfModule mpm_prefork_module>
    StartServers 4
    MinSpareServers 4
    MaxSpareServers 8
    ServerLimit 12
    MaxRequestWorkers 12
    MaxConnectionsPerChild 1000
</IfModule>
<IfModule !unixd_module>
    LoadModule unixd_module /usr/lib/apache2/mod_unixd.so
</IfModule>
LoadModule authz_core_module /usr/lib/apache2/mod_authz_core.so
LoadModule authz_host_module /usr/lib/apache2/mod_authz_host.so
<IfModule !log_config_module>
    LoadModule log_config_module /usr/lib/apache2/mod_log_config.so
</IfModule>
LoadModule mime_module /usr/lib/apache2/mod_mime.so
LoadModule dir_module /usr/lib/apache2/mod_dir.so
LoadModule headers_module /usr/lib/apache2/mod_headers.so
LoadModule setenvif_module /usr/lib/apache2/mod_setenvif.so
LoadModule remoteip_module /usr/lib/apache2/mod_remoteip.so
LoadModule rewrite_module /usr/lib/apache2/mod_rewrite.so
LoadModule php_module /usr/lib/apache2/mod_php84.so
User www-data
Group www-data
ServerTokens Prod
ServerSignature Off
TraceEnable Off
ErrorLog /proc/self/fd/2
LogLevel warn
LogFormat "%h %l %u %t %m %U %H %>s %b" book
CustomLog /proc/self/fd/1 book
TypesConfig /etc/apache2/mime.types
DirectoryIndex index.php index.html
DocumentRoot /opt/cajeerbook/public
<Directory />
    AllowOverride None
    Require all denied
</Directory>
<Directory /opt/cajeerbook/public>
    Require all granted
    AllowOverride None
    Options -Indexes -FollowSymLinks
    FallbackResource /index.php
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1
    Header always setifempty X-Content-Type-Options "nosniff"
    <FilesMatch "\\.php$">
        SetHandler application/x-httpd-php
    </FilesMatch>
</Directory>
# Existing distributed Compose mount retains the same trusted proxy config path.
IncludeOptional /etc/apache2/conf-enabled/*.conf
