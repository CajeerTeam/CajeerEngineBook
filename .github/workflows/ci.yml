name: Book CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, fileinfo, phar, gd, zip, openssl, sodium, pcntl
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y nginx-light
      - run: npm install --global typescript@5.8.3
      - run: python -m pip install playwright==1.57.0 'setuptools>=68' wheel
      - run: python -m playwright install --with-deps chromium
      - run: python3 tests/release-gate.py --suite native --report-dir "$RUNNER_TEMP/book-gate-native"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-gate-native
          path: ${{ runner.temp }}/book-gate-native
          if-no-files-found: warn
  postgres-content:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, fileinfo, phar, gd, zip, openssl, sodium, pcntl, pdo_pgsql, redis
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tests/release-gate.py --suite postgres --report-dir "$RUNNER_TEMP/book-gate-postgres"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-gate-postgres
          path: ${{ runner.temp }}/book-gate-postgres
          if-no-files-found: warn
  docker-release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: none
      - run: python3 tests/release-gate.py --suite docker --report-dir "$RUNNER_TEMP/book-gate-docker"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-gate-docker
          path: ${{ runner.temp }}/book-gate-docker
          if-no-files-found: warn
  distributed-release:
    needs: [test, postgres-content]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: none
      - run: python3 tests/release-gate.py --suite distributed --report-dir "$RUNNER_TEMP/book-gate-distributed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-gate-distributed
          path: ${{ runner.temp }}/book-gate-distributed
          if-no-files-found: warn
  domains-edge:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: none
      - run: python3 tests/release-gate.py --suite domains --report-dir "$RUNNER_TEMP/book-gate-domains"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-gate-domains
          path: ${{ runner.temp }}/book-gate-domains
          if-no-files-found: warn
  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, fileinfo, phar, gd, zip, openssl, sodium, pcntl
          tools: composer:v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent regression execution on a separate runner
        run: |
          mkdir -p "$RUNNER_TEMP/book-security"
          set -e -o pipefail
          {
            python3 tests/security-retest.py
            php tests/security-hardening.php --require-zip
            php tests/security-lifecycle.php
            python3 tests/security-lifecycle-http.py
            php tests/oidc-policy.php
            python3 tests/oidc-http.py
            python3 tests/security-http.py
            python3 tests/security-transport.py
          } 2>&1 | tee "$RUNNER_TEMP/book-security/retest.log"
      - run: python -m pip install semgrep==1.185.0
      - run: sh tests/security-scan.sh "$RUNNER_TEMP/book-security"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-scan
          path: ${{ runner.temp }}/book-security
          if-no-files-found: warn
  production-qualification:
    # Never schedule untrusted pull requests/branches on the dedicated long-run host.
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.ref_protected }}
    needs: [test, docker-release, postgres-content, distributed-release, domains-edge, security-scan]
    runs-on: [self-hosted, linux, book-load]
    environment: qualification
    timeout-minutes: 2400
    concurrency:
      group: book-production-qualification
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release source before long qualification
        run: |
          set -eu
          test "${GITHUB_REF}" = "refs/tags/v$(cat VERSION)"
          test "$(git cat-file -t "$GITHUB_REF")" = tag
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: sh bin/install-mermaid.sh
      - run: python3 tests/production-qualification.py --mode full --report-dir "$RUNNER_TEMP/book-production-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: book-production-qualification-${{ github.run_attempt }}
          path: ${{ runner.temp }}/book-production-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
  enterprise-release:
    needs: [test, docker-release, postgres-content, distributed-release, domains-edge, security-scan, production-qualification]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env:
      GATE_RESULTS: ${{ toJSON(needs) }}
      RELEASE_TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Require every enterprise release gate to pass
        run: |
          python3 - <<'PY'
          import os, json, sys
          results = json.loads(os.environ['GATE_RESULTS'])
          expected = {'test','docker-release','postgres-content','distributed-release','domains-edge','security-scan','production-qualification'}
          print(json.dumps({k:v['result'] for k,v in results.items()}, indent=2))
          long_expected='success' if os.environ['RELEASE_TAG']=='true' else 'skipped'
          sys.exit(0 if set(results)==expected and all(v['result']==(long_expected if k=='production-qualification' else 'success') for k,v in results.items()) else 1)
          PY
  release-candidate:
    # Tag builds must pass every gate from this exact workflow run first.
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: [test, postgres-content, docker-release, distributed-release, domains-edge, security-scan, enterprise-release]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    env:
      GATE_RESULTS: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, fileinfo, phar, gd, zip, openssl, sodium, pcntl, pdo_pgsql, redis
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: docker/setup-buildx-action@v3
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: sh bin/install-mermaid.sh
      - name: Log in to candidate registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - uses: actions/download-artifact@v4
        with:
          name: book-production-qualification-${{ github.run_attempt }}
          path: ${{ runner.temp }}/book-production-evidence
      - run: bash bin/release-build.sh "$RUNNER_TEMP/book-candidate" "$RUNNER_TEMP/book-production-evidence/qualification.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: book-candidate-${{ github.run_attempt }}
          path: ${{ runner.temp }}/book-candidate
          if-no-files-found: error
      - if: always()
        run: docker logout ghcr.io || true
  signed-release:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: [release-candidate, enterprise-release]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    concurrency:
      group: book-release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: book-candidate-${{ github.run_attempt }}
          path: ${{ runner.temp }}/book-candidate
      - uses: docker/setup-buildx-action@v3
      - uses: sigstore/cosign-installer@v4.1.0
        with:
          cosign-release: 'v3.1.4'
      - name: Log in to release registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Sign, verify and publish immutable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOOK_RELEASE_PRIVATE_KEY_B64: ${{ secrets.BOOK_RELEASE_PRIVATE_KEY_B64 }}
          BOOK_RELEASE_PUBLIC_KEY_B64: ${{ vars.BOOK_RELEASE_PUBLIC_KEY_B64 }}
        run: bash bin/release-publish.sh "$RUNNER_TEMP/book-candidate" "$RUNNER_TEMP/book-signed-release"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: book-signed-release
          path: ${{ runner.temp }}/book-signed-release
          if-no-files-found: error
      - if: always()
        run: docker logout ghcr.io || true
