name: Book CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, fileinfo, phar, gd, zip, openssl, sodium
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --global typescript@5.8.3
      - run: python -m pip install playwright==1.57.0 'setuptools>=68' wheel
      - run: python -m playwright install --with-deps chromium
      - run: python3 tests/release-gate.py --suite native --report-dir "$RUNNER_TEMP/book-gate-native"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-gate-native
          path: ${{ runner.temp }}/book-gate-native
          if-no-files-found: warn
  postgres-content:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, fileinfo, phar, gd, zip, openssl, sodium, pdo_pgsql, redis
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tests/release-gate.py --suite postgres --report-dir "$RUNNER_TEMP/book-gate-postgres"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-gate-postgres
          path: ${{ runner.temp }}/book-gate-postgres
          if-no-files-found: warn
  docker-release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: none
      - run: python3 tests/release-gate.py --suite docker --report-dir "$RUNNER_TEMP/book-gate-docker"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-gate-docker
          path: ${{ runner.temp }}/book-gate-docker
          if-no-files-found: warn
  distributed-release:
    needs: [test, postgres-content]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: none
      - run: python3 tests/release-gate.py --suite distributed --report-dir "$RUNNER_TEMP/book-gate-distributed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-gate-distributed
          path: ${{ runner.temp }}/book-gate-distributed
          if-no-files-found: warn
  domains-edge:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: none
      - run: python3 tests/release-gate.py --suite domains --report-dir "$RUNNER_TEMP/book-gate-domains"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-gate-domains
          path: ${{ runner.temp }}/book-gate-domains
          if-no-files-found: warn
  enterprise-release:
    needs: [test, docker-release, postgres-content, distributed-release, domains-edge]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env:
      GATE_RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Require every enterprise release gate to pass
        run: |
          python3 - <<'PY'
          import os, json, sys
          results = json.loads(os.environ['GATE_RESULTS'])
          expected = {'test','docker-release','postgres-content','distributed-release','domains-edge'}
          print(json.dumps({k:v['result'] for k,v in results.items()}, indent=2))
          sys.exit(0 if set(results)==expected and all(v['result']=='success' for v in results.values()) else 1)
          PY
