rules:
  - id: book-php-dynamic-code
    languages: [php]
    severity: ERROR
    message: Dynamic execution/deserialization requires explicit security review.
    paths:
      exclude: [core/Template/TemplateSandbox.php]
    pattern-either:
      - pattern: eval(...)
      - pattern: unserialize(...)
      - pattern: shell_exec(...)
      - pattern: system(...)
      - pattern: passthru(...)
      - pattern: exec(...)
  - id: book-php-archive-extraction
    languages: [php]
    severity: ERROR
    message: Extract only individually validated archive entries into private staging.
    pattern: $ARCHIVE->extractTo(...)
  - id: book-php-insecure-curl
    languages: [php]
    severity: ERROR
    message: TLS peer and hostname verification must not be disabled.
    pattern-either:
      - pattern: curl_setopt($C, CURLOPT_SSL_VERIFYPEER, false)
      - pattern: curl_setopt($C, CURLOPT_SSL_VERIFYHOST, 0)
